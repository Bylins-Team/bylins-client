name: Сборка

# Артефакты собираются на каждый push и живут 30 дней. Любой из них можно
# превратить в релиз workflow-ом «Релиз», указав номер этой сборки.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          # Разбор клавиш и модификаторы различаются по системам: определение
          # ОС, физический код клавиши, Cmd вместо Ctrl. Проверять их на одной
          # ubuntu значило проверять ровно ту ветку, где ничего не различается
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Прогнать тесты
        run: ./gradlew test

      # Отчёты нужны именно когда упало — иначе по логу не понять, что сломалось
      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Проверить MCP-мост
        run: python plugins/ai-control/mcp/test_bridge.py

  bundle:
    name: Дистрибутив (${{ matrix.platform }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      # Одна платформа упала — остальные всё равно доводим до конца
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          # У macOS образ устроен иначе — бандл вместо каталога, и
          # ошибки в его раскладке иначе видны только на машине автора
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Compose тянет платформозависимый Skiko и пакует свою JRE, поэтому
      # комплект собирается на каждой ОС свой — кроссплатформенного тут не бывает
      - name: Собрать дистрибутив
        run: ./gradlew releaseDist

      # Без плагинов клиент неполон: карта, миникарта и MSDP живут в
      # ассистенте. Проверяем, что они доехали, — раскладка образа у
      # каждой ОС своя, и промах виден только так
      - name: Проверить комплект
        shell: bash
        run: |
          root=$(ls -d build/release/*/)
          plugins=$(find "$root" -name 'assistant.jar' -o -name 'ai-control.jar')
          echo "$plugins"
          test "$(echo "$plugins" | grep -c jar)" -eq 2
          # Скрипты тоже внутри: снаружи бандла они пропадут при переносе
          # приложения в Applications
          find "$root" -name 'scripts' -type d
          test -n "$(find "$root" -name 'scripts' -type d)"
          # Плагины грузятся своим загрузчиком; попав в classpath
          # приложения, они перестали бы выгружаться
          ! grep -r 'plugins' --include='*.cfg' "$root"

      # На macOS установщик собирается из готового образа и должен получить
      # плагины вместе с ним. Упаковку никто, кроме CI, на маке не гоняет —
      # без этой проверки поломка всплывает только у контрибьютора
      - name: Собрать и проверить DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ./gradlew packageDmg
          dmg=$(ls build/compose/binaries/main/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          found=$(find "$mnt" -name 'assistant.jar' -o -name 'ai-control.jar')
          echo "$found"
          test -n "$(find "$mnt" -path '*Contents/scripts' -type d)"
          hdiutil detach "$mnt"
          test "$(echo "$found" | grep -c jar)" -eq 2

      # Каталогом, а не архивом: upload-artifact пакует сам, и готовый zip
      # внутри давал бы архив в архиве
      - uses: actions/upload-artifact@v7
        with:
          name: bylins-client-${{ matrix.platform }}
          path: build/release/*/
          retention-days: 30
          if-no-files-found: error
